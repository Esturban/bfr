version: 2

project_name: bfr

before:
  hooks:
    - go mod tidy

builds:
  - id: bfr
    main: .
    binary: bfr
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}

archives:
  - id: bfr
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^chore:"
      - "^docs:"

release:
  # This project has a single maintainer today. Draft nothing, prerelease
  # everything below v1.0.0: there is no consumer yet to protect from a
  # half-finished v0 tag.
  prerelease: auto

# Homebrew tap publishing: CONFIGURED, NOT ACTIVE.
# goreleaser fully deprecated `brews` as of v2.16; `homebrew_casks` is the
# current mechanism for shipping pre-compiled binaries via Homebrew, cask
# or not. skip_upload: true is the switch: goreleaser renders the cask file
# into dist/ locally but never pushes or commits it anywhere, regardless of
# whether the tap repo exists. github.com/Esturban/homebrew-tap does not
# exist yet. Creating a new public repo is the maintainer's call, not this pipeline's.
# To go live: (1) the maintainer creates the public repo github.com/Esturban/homebrew-tap
# by hand, (2) flip skip_upload to false here. Nothing else changes: the
# repository block below already points at it.
homebrew_casks:
  - name: bfr
    repository:
      owner: Esturban
      name: homebrew-tap
    homepage: https://github.com/Esturban/bfr
    description: Command-line client for Buffer's GraphQL API
    license: MIT
    skip_upload: true
